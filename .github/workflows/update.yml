name: Bondi 62 Real Parada 81
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, time, urllib3, math
          urllib3.disable_warnings()

          url = "https://micronauta4.dnsalias.net/usuario/urbano2_cmd.php?cmd=consultacocheporruta"

          # Datos EXACTOS de tu navegador, con tu parada TN12 = Parada 81
          data = {
              "ruta": "59",
              "coche": "0",
              "cliente": "411",
              "parada_seleccionada": "TN12",
              "conf": "cbaciudad",
              "operacion": str(int(time.time()*1000))  # numero random como hace la web
          }

          headers = {
              "Content-Type": "application/x-www-form-urlencoded",
              "Accept": "*/*",
              "Origin": "https://micronauta4.dnsalias.net",
              "Referer": "https://micronauta4.dnsalias.net/usuario/",
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "X-Device-FlakerParam": "283bd602072334b9b864737bc71c587c67f4ae74c03268ae6c6eadc6168ccade"
          }

          minutos = 99
          coche_data = None

          try:
              print(f"POST a {url} con {data}")
              r = requests.post(url, data=data, headers=headers, verify=False, timeout=15)
              print(f"Status: {r.status_code}")
              print(f"Respuesta cruda: {r.text[:2000]}")
              
              j = r.json()
              coches = j.get("coches", [])
              print(f"Coches encontrados: {len(coches)}")
              
              # Buscar linea 62 y quedarnos con el de menor demora
              mejor = None
              min_demora = 9999
              for c in coches:
                  if str(c.get("linea")) == "62":
                      d = c.get("demora_minutos")
                      if d is not None:
                          if d < min_demora:
                              min_demora = d
                              mejor = c
              
              if mejor:
                  coche_data = mejor
                  minutos = int(math.ceil(float(mejor.get("demora_minutos"))))
                  print(f"¡BINGO! Coche {mejor.get('coche')} - {mejor.get('demora')} -> {minutos} min")
              else:
                  print("No hay coches de linea 62 en este momento")
                  minutos = 0 # 0 = sin servicio o ya paso

          except Exception as e:
              print(f"Error: {e}")
              import traceback
              traceback.print_exc()

          print(f"FINAL PARA LCD: {minutos} min")

          payload = {
              "linea": "62",
              "parada": "81",
              "parada_codigo": "TN12",
              "minutos": minutos,
              "coche": coche_data.get("coche") if coche_data else "0",
              "demora_texto": coche_data.get("demora") if coche_data else "sin servicio",
              "actualizado": datetime.datetime.utcnow().isoformat() + "Z"
          }

          import subprocess
          js = json.dumps(payload)
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',js,'https://myesp8266-fbf11-default-rtdb.firebaseio.com/bondis/62.json'])
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',js,'https://myesp8266-fbf11.firebaseio.com/bondis/62.json'])
          print(f"Subido a Firebase: {js}")
          PY
