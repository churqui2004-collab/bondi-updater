name: Bondi 62 Real Parada 81
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Tiempo Real Parada 81
        run: |
          pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, urllib3
          urllib3.disable_warnings()

          # Esta es la API REAL que encontraste
          # Es la que usa tubondi.com por dentro
          url = "https://micronauta4.dnsalias.net/web/urbano2_cmd.php"
          params = {
              "cmd": "consultacocheporparada",
              "conf": "cbaciudad",
              "parada": "81",
              "linea": "62"
          }
          # A veces pide estos params, probamos con varios formatos
          intentos = [
              {"cmd": "consultacocheporparada", "parada": "81", "linea": "62", "conf": "cbaciudad"},
              {"cmd": "consultacochesporparada", "parada": "81", "conf": "cbaciudad"},
              {"cmd": "consultaarribos", "parada": "81", "conf": "cbaciudad"},
          ]

          minutos_final = None
          coche_info = None

          for p in intentos:
              try:
                  print(f"Probando: {p}")
                  r = requests.get(url, params=p, timeout=15, verify=False)
                  print(f"Status {r.status_code} - {r.text[:500]}")
                  data = r.json()
                  if "coches" in data and len(data["coches"]) > 0:
                      # Filtrar linea 62
                      for c in data["coches"]:
                          if c.get("linea") == "62":
                              coche_info = c
                              minutos_final = c.get("demora_minutos") or c.get("demora")
                              break
                      if not coche_info:
                          coche_info = data["coches"][0]
                          minutos_final = coche_info.get("demora_minutos")
                      break
              except Exception as e:
                  print(f"Error con {p}: {e}")
                  continue

          if minutos_final is None:
              print("No se pudo obtener real, intentando endpoint alternativo del mapa...")
              # Endpoint alternativo que viste en Network
              try:
                  r2 = requests.get("https://micronauta4.dnsalias.net/web/urbano2_cmd.php?cmd=consultacochepos&conf=cbaciudad", timeout=15, verify=False)
                  print(r2.text[:1000])
              except:
                  pass
              minutos_final = 99

          # Limpiar minutos - puede venir "31.83" o "32min"
          try:
              if isinstance(minutos_final, str):
                  minutos_final = int(''.join(filter(str.isdigit, minutos_final))[:2] or 99)
              else:
                  minutos_final = int(float(minutos_final))
          except:
              minutos_final = 99

          print(f"MINUTOS FINALES PARA LCD: {minutos_final}")

          payload = {
              "linea": "62",
              "parada": "81",
              "parada_nombre": "jose Isseas 1428",
              "minutos": minutos_final,
              "coche": coche_info.get("coche") if coche_info else "0",
              "lat": coche_info.get("lat") if coche_info else 0,
              "lon": coche_info.get("lon") if coche_info else 0,
              "actualizado": datetime.datetime.utcnow().isoformat() + "Z"
          }

          import subprocess, json as js
          j = js.dumps(payload)
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',j,'https://myesp8266-fbf11-default-rtdb.firebaseio.com/bondis/62.json'])
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',j,'https://myesp8266-fbf11.firebaseio.com/bondis/62.json'])
          print(f"Subido a Firebase: {j}")
          PY
