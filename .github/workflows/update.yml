name: Bondi 62 Real Parada 81
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install requests -q
          python3 << 'PY'
          import requests, json, datetime, urllib3
          urllib3.disable_warnings()

          # Vamos a copiar EXACTO lo que hace tu navegador
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36",
              "Accept": "application/json, text/javascript, */*; q=0.01",
              "Referer": "https://micronauta4.dnsalias.net/usuario/",
              "Origin": "https://micronauta4.dnsalias.net"
          }

          # PROBAMOS TODAS LAS VARIANTES POSIBLES CON /usuario/
          urls_a_probar = [
              "https://micronauta4.dnsalias.net/usuario/urbano2_cmd.php?cmd=consultacocheporruta&ruta=59&conf=cbaciudad",
              "https://micronauta4.dnsalias.net/usuario/urbano2_cmd.php?cmd=consultacocheporruta&ruta=59",
              "https://micronauta4.dnsalias.net/usuario/urbano2_cmd.php?cmd=consultacocheporparada&parada=81&conf=cbaciudad",
              "https://micronauta4.dnsalias.net/usuario/urbano2_cmd.php?cmd=consultacochesporparada&parada=81&conf=cbaciudad",
              "https://micronauta4.dnsalias.net/web/urbano2_cmd.php?cmd=consultacocheporparada&parada=81&conf=cbaciudad",
          ]

          minutos = 99
          coche_data = None

          for test_url in urls_a_probar:
              try:
                  print(f"\n>>> Probando: {test_url}")
                  r = requests.get(test_url, headers=headers, verify=False, timeout=15)
                  print(f"Status: {r.status_code} | Largo: {len(r.text)}")
                  print(f"Texto: {r.text[:1500]}")
                  if "coches" in r.text and "62" in r.text:
                      data = r.json()
                      coches = data.get("coches", []) if isinstance(data, dict) else data
                      for c in coches:
                          if str(c.get("linea")) == "62":
                              minutos = int(float(c.get("demora_minutos", 99)))
                              coche_data = c
                              print(f"¡ENCONTRADO! {minutos} min - Coche {c.get('coche')}")
                              break
                      if minutos != 99:
                          break
              except Exception as e:
                  print(f"Error: {e}")

          print(f"\n=== FINAL: {minutos} minutos ===")

          payload = {
              "linea": "62",
              "parada": "81",
              "minutos": minutos,
              "coche": coche_data.get("coche") if coche_data else "0",
              "demora_texto": coche_data.get("demora") if coche_data else "",
              "actualizado": datetime.datetime.utcnow().isoformat() + "Z",
              "debug_url": test_url if 'test_url' in locals() else ""
          }

          import subprocess
          j = json.dumps(payload)
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',j,'https://myesp8266-fbf11-default-rtdb.firebaseio.com/bondis/62.json'])
          subprocess.run(['curl','-s','-X','PUT','-H','Content-Type: application/json','-d',j,'https://myesp8266-fbf11.firebaseio.com/bondis/62.json'])
          PY
